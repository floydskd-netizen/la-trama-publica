<main><section class="archive-hero"><div class="wrap narrow"><p class="eyebrow">Administración privada</p><h1>Aportes de lectores</h1><p class="lead">Revisá fuentes enviadas por la comunidad. Sólo los aportes marcados como verificados aparecen públicamente con el crédito elegido por el colaborador.</p></div></section>
<section class="section"><div class="wrap narrow">
<div id="auth-box" class="discussion-auth"><h3>Acceso de administrador</h3><form id="email-form"><label>Email<input id="email" type="email" autocomplete="email" required></label><button class="btn primary" type="submit">Enviar código</button></form><form id="code-form" hidden><label>Código de acceso<input id="code" type="text" inputmode="numeric" pattern="[0-9]{6,10}" maxlength="10" autocomplete="one-time-code" required></label><button class="btn primary" type="submit">Verificar código</button></form><p id="auth-status" class="muted"></p><button id="auth-logout" class="btn ghost" type="button" hidden>Cerrar sesión</button></div>

</div></section></main>
